neo_menu_link.settings:
  type: config_object
  label: 'Neo | Menu link settings'
  mapping:
    icon_libraries:
      type: sequence
      label: Icon Libraries
      sequence:
        type: string
        label: Icon Library
    target:
      type: boolean
      label: Allow target selection
    class:
      type: boolean
      label: Allow adding custom CSS classes
    class_list:
      type: string
      label: List of allowed CSS classes
    spacers:
      type: boolean
      label: Allow spacer links

