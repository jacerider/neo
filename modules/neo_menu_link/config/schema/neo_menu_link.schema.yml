neo_menu_link.settings:
  type: neo_menu_link
  mapping:
    _core:
      # Added by the config installer; only exists for merging config.
      requiredKey: false
      type: _core_config_info

# Required by neo_settings.schema.yml, which resolves a variation's stored
# settings via `type: neo_settings.settings.[%parent.plugin]`.
neo_settings.settings.neo_menu_link:
  type: neo_menu_link

neo_menu_link:
  type: mapping
  label: 'Neo | Menu link settings'
  mapping:
    icon_libraries:
      type: sequence
      label: Icon Libraries
      sequence:
        type: string
        label: Icon Library
    target:
      type: boolean
      label: Allow target selection
    class:
      type: boolean
      label: Allow adding custom CSS classes
    class_list:
      type: string
      label: List of allowed CSS classes
    spacers:
      type: boolean
      label: Allow spacer links

