parameters:
  # Every hook this module implements is a method on a class under `src/Hook`,
  # so there is nothing procedural left for core's hook collector to find. This
  # is the parameter core provides for exactly that statement, set by a dozen
  # core modules. It is not cosmetic: without it the collector reads
  # `neo_table_props()` — a global function that is not a hook at all — as an
  # implementation of a `hook_table_props` that does not exist, and registers it
  # as one. Extension loading is unaffected, so `neo.module` is still included
  # and the table props shim, `ksm()` and `kint()` are all still defined.
  neo.skip_procedural_hook_scan: true

services:
  # `path_alias.manager` and `plugin.manager.linkit.substitution` are optional
  # references (`@?`). Both modules are declared dependencies, yet a container
  # can hold `neo` without them: `neo` sits in a dependency loop (neo ->
  # neo_icon -> neo_modal / neo_config_file -> neo), around which core computes
  # an incomplete dependency list, so installing a module in the loop on a
  # fresh site installs `neo` without them; a kernel test lists its modules by
  # hand; and a site updating to a release that declares a new dependency runs
  # without it until someone enables it. A hard reference makes each of those a
  # container that will not compile, which takes down the whole site, not just
  # links. Optional, the resolver gets NULL and only a code path that really
  # needs the missing service fails, the same contract as
  # NeoLinkitResolver::fromContainer().
  neo.linkit_resolver:
    class: Drupal\neo\Linkit\NeoLinkitResolver
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'
      - '@module_handler'
      - '@stream_wrapper_manager'
      - '@?path_alias.manager'
      - '@language_manager'
      - '@config.factory'
      - '@request_stack'
      - '@?plugin.manager.linkit.substitution'
