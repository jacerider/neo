# Libraries

library.alpine:
  version: 3.13.8
  license:
    name: MIT
    url: https://github.com/alpinejs/alpine/blob/master/LICENSE.md
    gpl-compatible: true
  header: true
  js:
    lib/js/alpinejs.min.js: { minified: true, attributes: { defer: true } }

library.alpine.collapse:
